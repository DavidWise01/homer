name: Homer — Leapfrog Hop

# GitHub's cron is `while True`. Each run = one hop of the single token.
# A -> O -> C -> R -> S1 -> S2 -> A.  6 hops = one full cycle.
on:
  schedule:
    - cron: '0 */6 * * *'      # every 6h
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: homer-leap            # one hop at a time, never overlap
  cancel-in-progress: false

jobs:
  hop:
    name: Leap one hop
    runs-on: ubuntu-latest
    timeout-minutes: 10                # Watchdog: stay inside free tier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Leap
        run: python agent/leap.py

      - name: Sentinel — integrity check
        run: python agent/leap.py --verify

      - name: Commit token + memory (only if changed)
        run: |
          git config user.name "homer-agent[bot]"
          git config user.email "homer-agent@users.noreply.github.com"
          git add agent/token.json agent/memory.json
          if git diff --staged --quiet; then
            echo "no change this hop"
          else
            git commit -m "homer: hop $(date -u +%Y%m%d-%H%M%S)"
            git push
          fi

  watchdog:
    name: Watchdog — issue on failure
    needs: hop
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Homer watchdog: hop failed (run ${context.runId})`,
              body: `A leapfrog hop failed.\n\nLogs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
